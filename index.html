<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>ESP32 Relay Control Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f9f9f9;
      margin: 0;
      padding: 0 10px 40px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      justify-content: space-between;
    }
    h1 {
      margin-top: 30px;
      font-size: 1.8rem;
    }
    .relay-card {
      display: inline-block;
      background-color: white;
      padding: 20px;
      margin: 15px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 220px;
      vertical-align: top;
    }
    .relay-card h2 {
      margin-bottom: 10px;
      font-size: 1.3rem;
    }
    .relay-card p {
      margin-bottom: 10px;
      font-size: 1rem;
    }
    .relay-card button {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      color: white;
      background-color: blue;
      cursor: pointer;
      font-size: 16px;
	  width: 90%;
      transition: opacity 0.3s ease;
    }
    .relay-card button:hover {
      opacity: 0.8;
    }
    #allOffBtn, #logoutBtn {
      max-width: 300px;
      width: 90%;
      padding: 12px 25px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin: 15px auto;
      display: block;
      color: white;
      transition: opacity 0.3s ease;
    }
    #allOffBtn {
      background-color: #d32f2f;
    }
    #allOffBtn:hover {
      opacity: 0.8;
    }
    #logoutBtn {
      background-color: #555;
    }
    #logoutBtn:hover {
      opacity: 0.8;
    }

    /* Responsive layout */
    #dashboard {
      display: block;
    }
    #dashboard .relay-container {
      max-width: 960px;
      margin: 20px auto 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }
    /* Smaller devices */
    @media (max-width: 700px) {
      .relay-card {
        width: 90%;
        margin: 10px auto;
        display: block;
      }
      body {
        padding: 0 10px 60px;
      }
    }
    footer {
      font-size: 0.9rem;
      color: #666;
      padding: 10px 0;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <h1>ESP32 Relay Control Dashboard</h1>
  <div id="dashboard">
    <div class="relay-container">
      <div class="relay-card">
        <h2>Relay 1</h2>
        <p>Status: <span id="status1">Loading...</span></p>
        <button id="btn1">Toggle</button>
      </div>
      <div class="relay-card">
        <h2>Relay 2</h2>
        <p>Status: <span id="status2">Loading...</span></p>
        <button id="btn2">Toggle</button>
      </div>
      <div class="relay-card">
        <h2>Relay 3</h2>
        <p>Status: <span id="status3">Loading...</span></p>
        <button id="btn3">Toggle</button>
      </div>
      <div class="relay-card">
        <h2>Relay 4</h2>
        <p>Status: <span id="status4">Loading...</span></p>
        <button id="btn4">Toggle</button>
      </div>
    </div>
    <button id="allOffBtn">All OFF</button>
  </div>
  <footer>
    Created by Tech StudyCell
  </footer>

  <!-- Firebase Modular SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
    import { getDatabase, ref, onValue, get, set } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

    // Your new Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyBuu66pP_mhjlviomBuL1_oIXJl6FHCfB4",
      authDomain: "crayfish-8ab8d.firebaseapp.com",
      databaseURL: "https://crayfish-8ab8d-default-rtdb.firebaseio.com",
      projectId: "crayfish-8ab8d",
      storageBucket: "crayfish-8ab8d.firebasestorage.app",
      messagingSenderId: "1065993108226",
      appId: "1:1065993108226:web:dbd74fc415d79cc8e5201b",
      measurementId: "G-5JF0PX7GMX"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Relay logic
    const relays = [
      { id: 1, path: "relay1" },
      { id: 2, path: "relay2" },
      { id: 3, path: "relay3" },
      { id: 4, path: "relay4" },
    ];

    relays.forEach(relay => {
      const statusText = document.getElementById(`status${relay.id}`);
      const toggleButton = document.getElementById(`btn${relay.id}`);
      const relayRef = ref(db, "/" + relay.path);

      // Listen for changes
      onValue(relayRef, (snapshot) => {
        const state = snapshot.val();
        statusText.innerText = state ? "ON" : "OFF";
        toggleButton.style.backgroundColor = state ? "green" : "blue";
      });

      // Toggle relay
      toggleButton.onclick = async () => {
        const snap = await get(relayRef);
        set(relayRef, !snap.val());
      };
    });

    // All OFF button
    document.getElementById("allOffBtn").onclick = () => {
      relays.forEach(relay => {
        set(ref(db, "/" + relay.path), false);
      });
    };
  </script>
</body>
</html>
